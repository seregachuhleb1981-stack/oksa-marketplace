name: Автоматичне оновлення каталогу OKSA

on:
  schedule:
    # Кожні 3 години. Хвилина 17 зменшує ризик затримок на початку години.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Запустити автоматичний імпорт
        shell: bash
        run: |
          set -euo pipefail

          token_response="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fprostoshop.online"
          )"

          token="$(printf '%s' "$token_response" | jq -er '.value')"

          response="$(
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $token" \
              "https://prostoshop.online/api/import/github"
          )"

          printf '%s\n' "$response"
