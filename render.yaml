services:
  - type: web
    name: oksa-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_SITE_URL
        value: https://prostoshop.online
      - key: DATABASE_URL
        sync: false
      - key: SUPPLIER_FEED_URL
        sync: false
      - key: IMPORT_SECRET
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GTM_ID
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
